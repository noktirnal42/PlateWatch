name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r integrations/mcp/requirements.txt
      - run: python -m unittest discover -s integrations/mcp/tests -v

  packages:
    strategy:
      fail-fast: false
      matrix:
        package: [PlateKit, CaptureKit, VehicleML, PlateSync, FleetImporters, AccountabilityKit, FeedIngest]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build + test packages/${{ matrix.package }}
        run: |
          swift build --package-path packages/${{ matrix.package }}
          swift test  --package-path packages/${{ matrix.package }}

  server:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build + test reference server
        run: |
          swift build --package-path server
          swift test  --package-path server

  apps:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate projects
        run: |
          # project.local.yml (team ID, gitignored) is optional locally but the runner's
          # xcodegen requires the included file to exist: use the example (no team) in CI.
          for d in ios macos-hub watchos; do
            cp "apps/$d/project.local.example.yml" "apps/$d/project.local.yml"
            (cd "apps/$d" && xcodegen)
          done
      - name: Build iOS app (simulator, unsigned)
        run: xcodebuild -project apps/ios/PlateWatch.xcodeproj -scheme PlateWatch -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS hub (unsigned)
        run: xcodebuild -project apps/macos-hub/PlateWatchHub.xcodeproj -scheme PlateWatchHub -destination 'generic/platform=macOS' -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Test macOS Hub polling, blocks, favorites and moderation (unsigned, hostless)
        run: xcodebuild -project apps/macos-hub/PlateWatchHub.xcodeproj -scheme PlateWatchHub -destination 'platform=macOS' -configuration Debug -parallel-testing-enabled NO -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO test
      - name: Build watchOS app (simulator, unsigned)
        run: xcodebuild -project apps/watchos/PlateWatchWatch.xcodeproj -scheme PlateWatchWatch -destination 'generic/platform=watchOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  ios-review:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate iOS project
        run: |
          brew install xcodegen
          cp apps/ios/project.local.example.yml apps/ios/project.local.yml
          (cd apps/ios && xcodegen)
      - name: Test iOS review and isolated preview flows
        run: |
          xcodebuild -project apps/ios/PlateWatch.xcodeproj -scheme PlateWatch \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=latest' \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO test

  eval-harness:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the evaluation harness (the corpus itself is not in CI)
        run: swift build -c release --package-path eval/harness

  model-pipeline:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint conversion script (no weight downloads in CI)
        run: |
          python -m py_compile scripts/convert_models.py
          python -c "import json; json.load(open('models/registry.json'))"
