include:
  - path: project.local.yml
    required: false
name: PlateWatch
options:
  bundleIdPrefix: org.platewatch
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PlateWatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "PlateWatch identifies taxpayer-funded vehicles on public roads using on-device ML. Video is analyzed on-device; raw footage is never uploaded."
        NSLocationWhenInUseUsageDescription: "Sightings are bucketed to ~1 km; precise location is only attached to fleet-confirmed vehicles."
        CFBundleDisplayName: PlateWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        PlateWatchUseCloudKit: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: PlateWatchCarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    entitlements:
      path: Support/PlateWatch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.org.platewatch.platewatch]
        com.apple.developer.icloud-services: [CloudKit]
    dependencies:
      - package: PlateKit
      - package: CaptureKit
      - package: VehicleML
      - package: PlateSync

  PlateWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PlateWatch
      - package: PlateKit

  PlateWatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PlateWatch

packages:
  PlateKit: { path: ../../packages/PlateKit }
  CaptureKit: { path: ../../packages/CaptureKit }
  VehicleML: { path: ../../packages/VehicleML }
  PlateSync: { path: ../../packages/PlateSync }

schemes:
  PlateWatch:
    build:
      targets:
        PlateWatch: all
    test:
      targets: [PlateWatchTests, PlateWatchUITests]
