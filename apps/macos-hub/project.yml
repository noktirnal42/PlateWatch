include:
  - path: project.local.yml
    required: false
name: PlateWatchHub
options:
  bundleIdPrefix: org.platewatch
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PlateWatchHub:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info.plist
      properties:
        LSUIElement: false   # full desktop app (the menu-bar item stays as a status shortcut)
        NSLocationUsageDescription: "Optional: set this Hub's home area from your location. Only a ~1 km area is stored, and only when you press Use my location."
        NSLocationWhenInUseUsageDescription: "Optional: set this Hub's home area from your location. Only a ~1 km area is stored, and only when you press Use my location."
        NSCameraUsageDescription: "The Hub can analyze cameras (including iPhones via Continuity Camera) for fleet vehicle identification, on-device."
        NSBonjourServices: [_platewatch-snapshot._tcp]   # advertises the snapshot ingest endpoint to IP cameras on the LAN
        CFBundleDisplayName: PlateWatch Hub
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Support/PlateWatchHub.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.org.platewatch.platewatch]
        com.apple.developer.icloud-services: [CloudKit]
    dependencies:
      - package: PlateKit
      - package: CaptureKit
      - package: VehicleML
      - package: PlateSync
      - package: FeedIngest
      - package: FleetImporters
      - package: AccountabilityKit

  PlateWatchHubTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/EvidenceCrop.swift
      - Sources/EvidenceArchive.swift
      - Sources/FeedRunner.swift
      - Sources/HLSPreviewBudget.swift
      - Sources/Console/FeedPreferences.swift
      - Sources/Console/ModeratorAccess.swift
      - Sources/Console/ModerationStore.swift
      - Sources/Console/RecordsWorkspace.swift
      - Sources/Console/ReviewPane.swift
      - Sources/Console/ReviewQueue.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: FeedIngest
      - package: PlateKit
      - package: PlateSync
      - package: AccountabilityKit

packages:
  PlateKit: { path: ../../packages/PlateKit }
  CaptureKit: { path: ../../packages/CaptureKit }
  VehicleML: { path: ../../packages/VehicleML }
  PlateSync: { path: ../../packages/PlateSync }
  FeedIngest: { path: ../../packages/FeedIngest }
  FleetImporters: { path: ../../packages/FleetImporters }
  AccountabilityKit: { path: ../../packages/AccountabilityKit }

schemes:
  PlateWatchHub:
    build:
      targets:
        PlateWatchHub: all
    test:
      targets: [PlateWatchHubTests]
      parallelizable: false
