include:
  - path: project.local.yml
    required: false
name: PlateWatchWatch
options:
  bundleIdPrefix: org.platewatch
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PlateWatchWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Sources
      - Shared
      - Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Support/PlateWatchWatch.entitlements
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PlateWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKWatchOnly: true
        WKApplication: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: PlateKit
      - package: PlateSync
      - target: PlateWatchComplication
    # No CaptureKit/VehicleML: the watch has no camera hardware. It is a
    # companion for alerts and quick-log notes that sync via CloudKit.

  PlateWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Complication
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.platewatch.PlateWatchWatch.complication
        INFOPLIST_FILE: Complication/Info.plist
    entitlements:
      path: Support/PlateWatchWatch.entitlements

packages:
  PlateKit: { path: ../../packages/PlateKit }
  PlateSync: { path: ../../packages/PlateSync }
