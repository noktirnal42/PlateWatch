name: PlateWatchWatch
options:
  bundleIdPrefix: org.openalpr
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PlateWatchWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PlateWatch
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: PlateKit
      - package: PlateSync
    # No CaptureKit/VehicleML: the watch has no camera hardware. It is a
    # companion for alerts and quick-log notes that sync via CloudKit.

packages:
  PlateKit: { path: ../../packages/PlateKit }
  PlateSync: { path: ../../packages/PlateSync }
