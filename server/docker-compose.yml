version: "3.9"
# Local dev database for the reference mirror. Production free-tier hosting
# runs the same stack — see docs/BACKEND.md (Oracle Always Free).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platewatch
      POSTGRES_PASSWORD: platewatch-dev-only
      POSTGRES_DB: platewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platewatch"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
