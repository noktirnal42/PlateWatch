# Local dev database for the reference mirror. Production free-tier hosting
# runs the same stack — see docs/BACKEND.md (Oracle Always Free).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platewatch
      POSTGRES_PASSWORD: platewatch-dev-only
      POSTGRES_DB: platewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platewatch"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8083
      DATABASE_URL: postgres://platewatch:platewatch-dev-only@postgres:5432/platewatch
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
volumes:
  pgdata:
