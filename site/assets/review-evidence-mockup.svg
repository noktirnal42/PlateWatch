<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171E"/><stop offset="1" stop-color="#0B0D11"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="30" y="44" fill="#FFC21A" font-size="15" font-weight="700">PlateWatch Hub — Review (illustrated mockup, not an app screenshot)</text>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#232A36"/>

  <!-- Sidebar -->
  <rect x="0" y="60" width="210" height="500" fill="#101319"/>
  <g font-size="14" fill="#9AA3B2">
    <text x="26" y="100">Dashboard</text>
    <text x="26" y="136">Live</text>
    <text x="26" y="172">Public feeds</text>
    <text x="26" y="208">Cameras & ingest</text>
  </g>
  <rect x="10" y="222" width="190" height="30" rx="8" fill="#FFC21A" opacity="0.16"/>
  <rect x="10" y="222" width="190" height="30" rx="8" fill="none" stroke="#FFC21A"/>
  <text x="26" y="243" fill="#FFD866" font-size="14" font-weight="600">Review</text>
  <g font-size="14" fill="#9AA3B2">
    <text x="26" y="279">Models</text>
    <text x="26" y="315">Records & FOIA</text>
    <text x="26" y="351">Moderation</text>
    <text x="26" y="387">Settings</text>
  </g>

  <!-- Table header -->
  <text x="240" y="96" fill="#F1EFE8" font-size="15" font-weight="700">30 queued</text>
  <g font-size="12" fill="#9AA3B2" font-weight="600">
    <text x="240" y="126">IMAGE</text><text x="316" y="126">CAPTURED</text><text x="452" y="126">AGENCY</text>
    <text x="700" y="126">UNIT</text><text x="790" y="126">AREA</text><text x="880" y="126">FLEET</text>
  </g>
  <line x1="230" y1="138" x2="1170" y2="138" stroke="#232A36"/>

  <!-- Rows: synthetic thumbnails -->
  <g>
    <g transform="translate(0,0)">
      <rect x="236" y="150" width="64" height="40" rx="6" fill="#1B212C" stroke="#2E3644"/>
      <path d="M248 178 q6 -14 20 -14 q14 0 20 14 z" fill="#3A4354"/><circle cx="254" cy="179" r="4" fill="#2E3644"/><circle cx="282" cy="179" r="4" fill="#2E3644"/>
      <text x="316" y="175" fill="#F1EFE8" font-size="13">10/14 4:17 PM</text>
      <text x="452" y="175" fill="#F1EFE8" font-size="13">AUSTIN FIRE DEPARTMENT</text>
      <text x="700" y="175" fill="#F1EFE8" font-size="13">—</text>
      <text x="790" y="175" fill="#F1EFE8" font-size="13" font-family="monospace">9v6ebr</text>
      <text x="880" y="175" fill="#5CD08B" font-size="13">70%</text>
    </g>
    <g transform="translate(0,52)">
      <rect x="236" y="150" width="64" height="40" rx="6" fill="#1B212C" stroke="#2E3644"/>
      <rect x="244" y="164" width="30" height="16" rx="3" fill="#3A4354"/><rect x="278" y="164" width="14" height="16" rx="3" fill="#2E3644"/>
      <text x="316" y="175" fill="#F1EFE8" font-size="13">10/14 3:50 PM</text>
      <text x="452" y="175" fill="#F1EFE8" font-size="13">SCHOOL BUS</text>
      <text x="700" y="175" fill="#F1EFE8" font-size="13">7432</text>
      <text x="790" y="175" fill="#F1EFE8" font-size="13" font-family="monospace">9v6eb6</text>
      <text x="880" y="175" fill="#5CD08B" font-size="13">57%</text>
    </g>
    <g transform="translate(0,104)">
      <rect x="236" y="150" width="64" height="40" rx="6" fill="#1B212C" stroke="#2E3644"/>
      <path d="M246 180 q8 -18 22 -18 q14 0 22 18 z" fill="#3A4354"/><rect x="270" y="158" width="10" height="6" rx="2" fill="#FFC21A" opacity="0.7"/>
      <text x="316" y="175" fill="#F1EFE8" font-size="13">10/14 3:29 PM</text>
      <text x="452" y="175" fill="#F1EFE8" font-size="13">TEXAS HIGHWAY PATROL</text>
      <text x="700" y="175" fill="#F1EFE8" font-size="13">—</text>
      <text x="790" y="175" fill="#F1EFE8" font-size="13" font-family="monospace">9v6kpu</text>
      <text x="880" y="175" fill="#5CD08B" font-size="13">57%</text>
    </g>
    <g transform="translate(0,156)">
      <rect x="236" y="150" width="64" height="40" rx="6" fill="#1B212C" stroke="#2E3644" stroke-dasharray="3 3"/>
      <text x="248" y="174" fill="#586070" font-size="11">no image</text>
      <text x="316" y="175" fill="#F1EFE8" font-size="13">10/13 8:51 PM</text>
      <text x="452" y="175" fill="#F1EFE8" font-size="13">POLICE</text>
      <text x="700" y="175" fill="#F1EFE8" font-size="13">222</text>
      <text x="790" y="175" fill="#F1EFE8" font-size="13" font-family="monospace">9zvxyp</text>
      <text x="880" y="175" fill="#5CD08B" font-size="13">57%</text>
    </g>
  </g>
  <line x1="230" y1="358" x2="1170" y2="358" stroke="#232A36"/>
  <text x="240" y="386" fill="#586070" font-size="12.5">Evidence crops are redacted vehicle cutouts from the analysed frame (≤40 KB JPEG + SHA-256).</text>
  <text x="240" y="406" fill="#586070" font-size="12.5">Click a thumbnail to inspect at full resolution. Other vehicles' plates and text are blocked out; intrusive crops are skipped.</text>
  <text x="240" y="426" fill="#586070" font-size="12.5">The backend keeps the crop hash — never image bytes. Legacy rows (recorded before capture) show "no image".</text>
</svg>
